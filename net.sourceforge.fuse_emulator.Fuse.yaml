app-id: net.sourceforge.fuse_emulator.Fuse
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: fuse
finish-args:
  # Wayland and X11 access
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # Sound
  - --socket=pulseaudio
  - --device=all
  # Network access (for Spectranet)
  - --share=network
  # Home directory (for loading and saving Spectrum software)
  - --filesystem=home
build-options:
  cppflags: -DG_DISABLE_CAST_CHECKS
  env:
    V: '1'
cleanup:
  - /include
  - /lib/*.a
  - /lib/*.la
  - /lib/*.so
  - /lib/pkgconfig
  - /share/applications/mimeinfo.cache
  - /share/icons/hicolor/icon-theme.cache
  - /share/man
modules:
  # Audiofile is used for loading Spectrum data from WAV files
  - name: libaudiofile
    config-opts:
      - --disable-docs
      - --disable-examples
      - --disable-flac
      - --disable-static
    sources:
      - type: archive
        url: http://audiofile.68k.org/audiofile-0.3.6.tar.gz
        sha256: cdc60df19ab08bfe55344395739bb08f50fc15c92da3962fac334d3bff116965
      - type: patch
        path: audiofile-build.patch
    cleanup:
      - /bin
  # Library to handle Spectrum snapshots, tapes and other files
  - name: libspectrum
    sources:
      - type: archive
        url: https://download.sourceforge.net/project/fuse-emulator/libspectrum/1.6.4/libspectrum-1.6.4.tar.gz
        sha256: 4cce5764227f040238877d9e0ce3aede2bac1b1adfa8ed535d68bb405df395c3
  # Misc utilities (not needed if you simply want to run Fuse)
  - name: fuse-utils
    sources:
      - type: archive
        url: https://download.sourceforge.net/project/fuse-emulator/fuse-utils/1.4.7/fuse-utils-1.4.7.tar.gz
        sha256: 1a2e7be6447476d45c606c44536805cdb0dfb29d7f41632602d9a6883bf1e4b6
  # The SDL version of the emulator
  - name: fuse-sdl
    config-opts:
      - --with-sdl
      - --enable-desktop-integration
    make-args:
      - EXEEXT=-sdl
    make-install-args:
      - EXEEXT=-sdl
    rm-configure: true
    post-install:
      - mv /app/share/applications/net.sourceforge.fuse_emulator.Fuse.desktop /app/share/applications/net.sourceforge.fuse_emulator.Fuse.SDL.desktop
      - >-
         desktop-file-edit --set-key=Name --set-value='SDL Fuse'
         /app/share/applications/net.sourceforge.fuse_emulator.Fuse.SDL.desktop
    sources:
      - type: archive
        url: https://download.sourceforge.net/project/fuse-emulator/fuse/1.9.2/fuse-1.9.2.tar.gz
        sha256: ad04be2c67172c5387fd2cd84350ed8215958fa5b8a52a4990862867f089f489
      - type: script
        dest-filename: autogen.sh
        commands:
          - autoreconf -f -i -I m4
  # The GTK version of the emulator
  - name: fuse
    config-opts:
      - --with-x
      - --with-audio-driver=sdl
      - --enable-desktop-integration
    rm-configure: true
    sources:
      - type: archive
        url: https://download.sourceforge.net/project/fuse-emulator/fuse/1.9.2/fuse-1.9.2.tar.gz
        sha256: ad04be2c67172c5387fd2cd84350ed8215958fa5b8a52a4990862867f089f489
      - type: script
        dest-filename: autogen.sh
        commands:
          - autoreconf -f -i -I m4
