app-id: net.sourceforge.fuse_emulator.Fuse
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: fuse
finish-args:
  # Wayland and X11 access
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # Sound
  - --socket=pulseaudio
  - --device=all
  # Network access (for Spectranet)
  - --share=network
  # Home directory (for loading and saving Spectrum software)
  - --filesystem=home
build-options:
  cppflags: -DG_DISABLE_CAST_CHECKS
  env:
    V: '1'
cleanup:
  - /include
  - /lib/*.a
  - /lib/*.la
  - /lib/*.so
  - /lib/pkgconfig
  - /share/applications/mimeinfo.cache
  - /share/icons/hicolor/icon-theme.cache
  - /share/man
modules:
  # Audiofile is used for loading Spectrum data from WAV files
  - name: libaudiofile
    config-opts:
      - --disable-docs
      - --disable-examples
      - --disable-flac
      - --disable-static
    sources:
      - type: archive
        url: http://audiofile.68k.org/audiofile-0.3.6.tar.gz
        sha256: cdc60df19ab08bfe55344395739bb08f50fc15c92da3962fac334d3bff116965
      - type: patch
        path: audiofile-build.patch
    cleanup:
      - /bin
  # Library to handle Spectrum snapshots, tapes and other files
  - name: libspectrum
    sources:
      - type: archive
        url: https://download.sourceforge.net/project/fuse-emulator/libspectrum/1.8.0/libspectrum-1.8.0.tar.gz
        sha256: 3a3322f906f054987163c2e9707160b7cda302ee46d64111c7cb6ec33adc9d04
  # Misc utilities (not needed if you simply want to run Fuse)
  - name: fuse-utils
    sources:
      - type: archive
        url: https://download.sourceforge.net/project/fuse-emulator/fuse-utils/1.5.1/fuse-utils-1.5.1.tar.gz
        sha256: 8644d8b6753b69864d6596acf995bdf100aa093a3c1bd6ba4308206a142931ed
  # The SDL version of the emulator
  - name: fuse-sdl
    config-opts:
      - --with-sdl
      - --enable-desktop-integration
    make-args:
      - EXEEXT=-sdl
    make-install-args:
      - EXEEXT=-sdl
    rm-configure: true
    post-install:
      - mv /app/share/applications/net.sourceforge.fuse_emulator.Fuse.desktop /app/share/applications/net.sourceforge.fuse_emulator.Fuse.SDL.desktop
      - >-
         desktop-file-edit --set-key=Name --set-value='SDL Fuse'
         /app/share/applications/net.sourceforge.fuse_emulator.Fuse.SDL.desktop
    sources:
      - type: archive
        url: https://download.sourceforge.net/project/fuse-emulator/fuse/1.10.1/fuse-1.10.1.tar.gz
        sha256: f57cd30f15bac6fb7a873b0ee406eb0014617691f665caa01d001624b4953e97
      - type: script
        dest-filename: autogen.sh
        commands:
          - autoreconf -f -i -I m4
  # The GTK version of the emulator
  - name: fuse
    config-opts:
      - --with-x
      - --with-audio-driver=sdl
      - --enable-desktop-integration
    rm-configure: true
    sources:
      - type: archive
        url: https://download.sourceforge.net/project/fuse-emulator/fuse/1.10.1/fuse-1.10.1.tar.gz
        sha256: f57cd30f15bac6fb7a873b0ee406eb0014617691f665caa01d001624b4953e97
      - type: script
        dest-filename: autogen.sh
        commands:
          - autoreconf -f -i -I m4
