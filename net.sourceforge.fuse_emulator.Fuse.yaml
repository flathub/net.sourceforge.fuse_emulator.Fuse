app-id: net.sourceforge.fuse_emulator.Fuse
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: fuse
finish-args:
  # Wayland and X11 access
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # Sound
  - --socket=pulseaudio
  - --device=all
  # Network access (for Spectranet)
  - --share=network
  # Home directory (for loading and saving Spectrum software)
  - --filesystem=home
build-options:
  cppflags: -DG_DISABLE_CAST_CHECKS
  env:
    V: '1'
cleanup:
  - /include
  - /lib/*.a
  - /lib/*.la
  - /lib/*.so
  - /lib/pkgconfig
  - /share/applications/mimeinfo.cache
  - /share/icons/hicolor/icon-theme.cache
  - /share/man
modules:
  # Audiofile is used for loading Spectrum data from WAV files
  - name: libaudiofile
    config-opts:
      - --disable-docs
      - --disable-examples
      - --disable-flac
      - --disable-static
    sources:
      - type: archive
        url: http://audiofile.68k.org/audiofile-0.3.6.tar.gz
        sha256: cdc60df19ab08bfe55344395739bb08f50fc15c92da3962fac334d3bff116965
      - type: patch
        path: audiofile-build.patch
    cleanup:
      - /bin
  # Library to handle Spectrum snapshots, tapes and other files
  - name: libspectrum
    sources:
      - type: archive
        url: https://download.sourceforge.net/project/fuse-emulator/libspectrum/1.7.0/libspectrum-1.7.0.tar.gz
        sha256: b537942b2aab090d2a72fec8f58e597cc7a1f76d74c27c034665e4727f02109f
  # Misc utilities (not needed if you simply want to run Fuse)
  - name: fuse-utils
    sources:
      - type: archive
        url: https://download.sourceforge.net/project/fuse-emulator/fuse-utils/1.5.0/fuse-utils-1.5.0.tar.gz
        sha256: e0ea58d393ca29f8b2462c647ff364d61a7404b33a14c63098495825f7ca99a0
  # The SDL version of the emulator
  - name: fuse-sdl
    config-opts:
      - --with-sdl
      - --enable-desktop-integration
    make-args:
      - EXEEXT=-sdl
    make-install-args:
      - EXEEXT=-sdl
    rm-configure: true
    post-install:
      - mv /app/share/applications/net.sourceforge.fuse_emulator.Fuse.desktop /app/share/applications/net.sourceforge.fuse_emulator.Fuse.SDL.desktop
      - >-
         desktop-file-edit --set-key=Name --set-value='SDL Fuse'
         /app/share/applications/net.sourceforge.fuse_emulator.Fuse.SDL.desktop
    sources:
      - type: archive
        url: https://download.sourceforge.net/project/fuse-emulator/fuse/1.10.0/fuse-1.10.0.tar.gz
        sha256: 65b3ccc23c8b31fe779d1ff53edc260f776c0eafa93137df95803f14ba801b09
      - type: script
        dest-filename: autogen.sh
        commands:
          - autoreconf -f -i -I m4
  # The GTK version of the emulator
  - name: fuse
    config-opts:
      - --with-x
      - --with-audio-driver=sdl
      - --enable-desktop-integration
    rm-configure: true
    sources:
      - type: archive
        url: https://download.sourceforge.net/project/fuse-emulator/fuse/1.10.0/fuse-1.10.0.tar.gz
        sha256: 65b3ccc23c8b31fe779d1ff53edc260f776c0eafa93137df95803f14ba801b09
      - type: script
        dest-filename: autogen.sh
        commands:
          - autoreconf -f -i -I m4
